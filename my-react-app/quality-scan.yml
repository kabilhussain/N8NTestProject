# Quality Scan for TheChief.
# n8n (QualityGate sub-workflow) starts this with workflow_dispatch on the task branch,
# waits for it to finish, and reads the "quality-results" artifact (findings.json).
#
# Tools: semgrep (code security + bugs), osv (dependencies), npm-audit (dependencies),
#        eslint (code bugs), gitleaks (secrets), trivy (dependencies + config + secrets).
# All are free and need no account. SonarCloud is read separately by n8n, if configured.

name: Quality Scan
run-name: "Quality scan ${{ inputs.run_key }}"

on:
  workflow_dispatch:
    inputs:
      tools:
        description: "Comma-separated: semgrep,osv,npm-audit,eslint,gitleaks,trivy"
        required: false
        default: "semgrep,osv,npm-audit,eslint,gitleaks"
      app_dir:
        description: "Folder of the app's package.json, for example my-react-app (empty = repo root)"
        required: false
        default: ""
      fix_deps:
        description: "Run npm audit fix and commit the result before scanning"
        type: boolean
        required: false
        default: false
      run_key:
        description: "Unique key from n8n, used to find this run"
        required: true

permissions:
  contents: write   # only used to push the npm audit fix commit to the task branch

concurrency:
  group: quality-scan-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pin these to fixed versions (or digests) once the setup works, so a scanner update cannot change results silently.
  SEMGREP_IMAGE: semgrep/semgrep:latest
  OSV_IMAGE: ghcr.io/google/osv-scanner:latest
  GITLEAKS_IMAGE: zricethezav/gitleaks:latest
  TRIVY_IMAGE: aquasec/trivy:latest
  TOOLS: ",${{ inputs.tools }},"
  APP_DIR: ${{ inputs.app_dir }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare
        run: |
          mkdir -p .quality
          echo "APP_PATH=${APP_DIR:-.}" >> "$GITHUB_ENV"

      - name: Fix dependencies (npm audit fix)
        if: ${{ inputs.fix_deps == true || inputs.fix_deps == 'true' }}
        run: |
          cd "$APP_PATH"
          [ -f package-lock.json ] || npm install --package-lock-only --ignore-scripts
          npm audit fix --ignore-scripts || true
          cd "$GITHUB_WORKSPACE"
          if ! git diff --quiet -- "$APP_PATH/package.json" "$APP_PATH/package-lock.json"; then
            git config user.name "thechief-bot"
            git config user.email "thechief-bot@users.noreply.github.com"
            git add "$APP_PATH/package.json" "$APP_PATH/package-lock.json"
            git commit -m "fix(deps): npm audit fix [${{ inputs.run_key }}]"
            git push
            echo "DEPS_FIXED=true" >> "$GITHUB_ENV"
          fi

      # Tools that read source files run before node_modules is installed.
      # Each step records: <tool>.json (output), <tool>.seconds (run time), <tool>.error (only if it failed).
      - name: Gitleaks (secrets)
        if: contains(env.TOOLS, ',gitleaks,')
        run: |
          start=$(date +%s); set +e
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" detect --source /repo --no-git --redact \
            --report-format json --report-path /repo/.quality/gitleaks.json --exit-code 0 2> .quality/gitleaks.log
          rc=$?
          [ $rc -eq 0 ] || echo "Gitleaks failed (exit $rc): $(tail -n 3 .quality/gitleaks.log)" > .quality/gitleaks.error
          echo $(( $(date +%s) - start )) > .quality/gitleaks.seconds

      - name: Semgrep (code security and bugs)
        if: contains(env.TOOLS, ',semgrep,')
        run: |
          start=$(date +%s); set +e
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan \
            --config p/javascript --config p/react --config p/secrets --metrics=off \
            --exclude .quality --json . > .quality/semgrep.json 2> .quality/semgrep.log
          rc=$?
          [ $rc -eq 0 ] || echo "Semgrep failed (exit $rc): $(tail -n 3 .quality/semgrep.log)" > .quality/semgrep.error
          echo $(( $(date +%s) - start )) > .quality/semgrep.seconds

      - name: OSV-Scanner (dependencies)
        if: contains(env.TOOLS, ',osv,')
        run: |
          start=$(date +%s); set +e
          docker run --rm -v "$PWD:/src" "$OSV_IMAGE" scan source -r --format json /src > .quality/osv.json 2> .quality/osv.log
          rc=$?
          # 0 = nothing found, 1 = vulnerabilities found. Anything else is a real error.
          [ $rc -le 1 ] || echo "OSV-Scanner failed (exit $rc): $(tail -n 3 .quality/osv.log)" > .quality/osv.error
          echo $(( $(date +%s) - start )) > .quality/osv.seconds

      - name: Trivy (dependencies and configuration)
        if: contains(env.TOOLS, ',trivy,')
        run: |
          start=$(date +%s); set +e
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs --quiet --scanners vuln,misconfig --format json \
            --skip-dirs /src/.quality /src > .quality/trivy.json 2> .quality/trivy.log
          rc=$?
          [ $rc -eq 0 ] || echo "Trivy failed (exit $rc): $(tail -n 3 .quality/trivy.log)" > .quality/trivy.error
          echo $(( $(date +%s) - start )) > .quality/trivy.seconds

      - name: npm audit (dependencies)
        if: contains(env.TOOLS, ',npm-audit,')
        run: |
          start=$(date +%s); set +e
          cd "$APP_PATH"
          if [ ! -f package.json ]; then
            echo "No package.json in $APP_PATH" > "$GITHUB_WORKSPACE/.quality/npm-audit.error"
          else
            [ -f package-lock.json ] || npm install --package-lock-only --ignore-scripts > /dev/null 2>&1
            # Exit code 1 means "vulnerabilities found". Real errors show up as an "error" key in the JSON.
            npm audit --json > "$GITHUB_WORKSPACE/.quality/npm-audit.json"
          fi
          echo $(( $(date +%s) - start )) > "$GITHUB_WORKSPACE/.quality/npm-audit.seconds"

      - name: ESLint (code bugs)
        if: contains(env.TOOLS, ',eslint,')
        run: |
          start=$(date +%s); set +e
          Q="$GITHUB_WORKSPACE/.quality"
          cd "$APP_PATH"
          if ls eslint.config.* .eslintrc* >/dev/null 2>&1; then
            (npm ci --ignore-scripts || npm install --ignore-scripts) > "$Q/eslint.log" 2>&1
            npx --no-install eslint . -f json -o "$Q/eslint.json" >> "$Q/eslint.log" 2>&1
            rc=$?
            # 0 = clean, 1 = problems found, 2 = ESLint itself failed
            [ $rc -le 1 ] || echo "ESLint failed (exit $rc): $(tail -n 3 "$Q/eslint.log")" > "$Q/eslint.error"
          else
            echo "No ESLint config in $APP_PATH" > "$Q/eslint.error"
          fi
          echo $(( $(date +%s) - start )) > "$Q/eslint.seconds"

      - name: Normalise findings
        if: always()
        run: |
          SHA=$(git rev-parse HEAD) TOOLS="${{ inputs.tools }}" APP_DIR="$APP_DIR" RUN_KEY="${{ inputs.run_key }}" \
          DEPS_FIXED="${DEPS_FIXED:-false}" node .github/scripts/normalize.mjs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-results
          path: |
            .quality/findings.json
            .quality/*.json
          retention-days: 14
